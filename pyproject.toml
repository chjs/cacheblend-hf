[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheblend-hf"
version = "0.0.1"
description = "Minimal CacheBlend implementation on HuggingFace Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take >30s (run with `pytest -m slow`)",
    "gpu: tests requiring CUDA",
    "requires_model: tests that download or load HF models (skipped in CI)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
